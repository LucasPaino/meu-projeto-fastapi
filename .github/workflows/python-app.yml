name: Python FastAPI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Fazer checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Python 3.13
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      # 3️⃣ Instalar Poetry
      - name: Install Poetry
        run: pip install poetry

      # 4️⃣ Instalar dependências do projeto (sem instalar o projeto em si)
      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      # 5️⃣ Rodar testes
      - name: Run tests
        run: poetry run pytest